# Parameters for the whole robot. Measure your robot and edit the footprint values:
# wrong lidar_to_front_m / robot_half_width_m make the safety layer stop too early or too late.

motion_controller:
  ros__parameters:
    control_rate_hz: 20.0
    summary_rate_hz: 5.0
    scan_timeout_s: 0.6
    ultrasonic_timeout_s: 0.5
    max_intent_duration_s: 6.0
    # Edge (cliff) sensors: the launch argument use_cliff:=true turns this on and starts
    # cliff_publisher. When on, the robot does not travel unless /cliff is fresh and clear.
    use_cliff_sensors: false
    cliff_timeout_s: 0.3
    # LiDAR mounting. Check with: ros2 topic echo /perception/summary
    # (hold a box in front of the robot: lidar_sectors_m.front must drop).
    lidar_yaw_offset_deg: 0.0     # rotate the scan so 0 deg is straight ahead
    lidar_reverse: false          # true if left/right come out swapped
    lidar_self_filter_m: 0.05     # ignore returns from the robot's own body
    lidar_to_front_m: 0.10        # LiDAR centre -> front bumper
    lidar_to_rear_m: 0.10         # LiDAR centre -> rear bumper
    robot_half_width_m: 0.10
    corridor_margin_m: 0.05
    ultrasonic_to_front_m: 0.0    # ultrasonic face -> front bumper (0 if flush)
    # Motion envelope
    max_linear: 0.25              # m/s
    max_angular: 1.2              # rad/s
    accel_linear: 0.35            # m/s^2
    decel_linear: 0.8             # m/s^2
    accel_angular: 2.5            # rad/s^2
    stop_distance: 0.20           # m clearance: stop travelling toward the obstacle
    slow_distance: 0.70           # m clearance: start slowing down
    hard_stop_distance: 0.10      # m clearance: immediate stop, bypasses ramping
    avoid_distance: 0.15          # m side gap where wall-avoidance steering starts
    avoid_gain: 0.6               # rad/s of steering at zero gap, full speed
    max_turn_while_blocked: 0.8   # rad/s

claude_agent:
  ros__parameters:
    model: claude-opus-5-5        # claude-haiku-5-5 is faster and cheaper if latency matters
    effort: low                   # low keeps decisions quick; raise for harder missions
    max_tokens: 4096
    refusal_fallback: true
    decision_period_s: 2.0        # one Claude call every ~2 s (longer if the call is slower)
    request_timeout_s: 15.0
    min_intent_duration_s: 1.0
    max_intent_duration_s: 6.0
    image_topic: /camera/image_raw
    image_width: 512
    image_height: 384
    jpeg_quality: 75
    history_length: 6
    mission: "Explore the area safely, heading for open space and avoiding obstacles."
    persona_file: ""              # robot identity; "" = find the repo's CLAUDE.md automatically
    memory_file: ~/.ros/robot_memory/notes.jsonl   # delete to make the robot forget
    memory_recall: 30             # notes replayed to Claude with every decision
    memory_max_notes: 500         # oldest notes are dropped beyond this

motor_driver:
  ros__parameters:
    max_wheel_speed_mps: 0.30     # wheel speed at 100% duty; calibrate on the floor
    track_width_m: 0.135          # left to right wheel centres (front-rear wheel centres: 0.115)
    # Motor power (PWM duty %). Wheel commands map onto min_duty..max_duty, so min_duty is
    # the power at the slowest speed. Raise it if the wheels stall (e.g. on carpet).
    # Change live:  ros2 param set /motor_driver surface carpet
    surface: hard_floor           # hard_floor | carpet (Ratangga can also switch this itself)
    hard_floor_min_duty: 60.0
    carpet_min_duty: 80.0
    min_duty: -1.0                # >= 0 overrides both presets
    max_duty: 100.0
    deadband: 0.02                # wheel commands below this fraction -> motor off
    kick_duty: 100.0              # % duty for a short burst when a wheel starts or reverses
    kick_s: 0.0                   # burst length in s; 0 = off (carpet: try 0.15-0.3)
    pwm_hz: 1000.0
    cmd_timeout_s: 0.5
    invert_left: false
    invert_right: false

ultrasonic_publisher:
  ros__parameters:
    rate_hz: 15.0
    timeout_s: 0.025

cliff_publisher:                # downward IR edge sensors; setup in the README ("Edge sensors")
  ros__parameters:
    sensor_names: [front_left, front_right]   # must start with "front" or "rear"
    sensor_pins: [5, 6]           # BCM pins, same order as sensor_names
    drop_level: 1                 # GPIO level meaning "no floor" (1 for TCRT5000/FC-51 modules)
    rate_hz: 50.0
    clear_count: 3                # floor readings in a row before an edge counts as gone

camera:                         # camera_ros; setup steps in the README ("RPi Camera setup")
  ros__parameters:
    camera: 0                     # first camera libcamera finds (`cam -l` lists them)
    width: 640
    height: 480
    format: RGB888
    orientation: 0                # 180 if the camera is mounted upside down
    # sensor_mode: "1640:1232"    # Camera Module 2: full field of view instead of a crop

lidar:                          # m1ct_d2; setup steps in the README ("LiDAR setup")
  ros__parameters:
    port: /dev/ttyUSB0            # the launch argument lidar_port overrides this
    baudrate: 230400
    frame_id: laser_link
    version: 4
